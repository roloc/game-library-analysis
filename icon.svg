<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Game Library Analysis">
  <rect width="512" height="512" rx="112" fill="#14182b"/>
  <!-- gamepad body -->
  <g fill="#e9ecf5">
    <rect x="72" y="168" width="368" height="156" rx="78"/>
    <circle cx="140" cy="304" r="68"/>
    <circle cx="372" cy="304" r="68"/>
  </g>
  <!-- d-pad -->
